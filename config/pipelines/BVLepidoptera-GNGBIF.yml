default:
  name: 'Check Lepidoptera from BV database with GBIF using GNVerifier'
  remote:
    processor: GNames\GNSpeciesProcessor
  input:
    type: datasource
    name: bv_lepidoptera_database # Datasource filename .yml
    parser: SpeciesParser
  output_ok:
    type: pipeline
    path: BVLepidoptera-GBIF_Obs_DB
  output_errors:
    type: pipeline
    path: BVLepidoptera-NoGBIF_Obs_DB