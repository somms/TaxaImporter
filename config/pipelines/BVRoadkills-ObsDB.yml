default:
  name: 'Check Diptera from BV database with GBIF using GNVerifier'
  remote:
    processor: GNames\GNSpeciesProcessor
  input:
    type: datasource
    name: bv_roadkills_database # Datasource filename .yml
    parser: Forum4Images\BV\RoadkillSpeciesParser
  output_ok:
    type: pipeline
    path: BVRoadkills-GNGBIF_ObsDB
  output_errors:
    type: pipeline
    path: BVRoadkills-NoGBIF_ObsDB